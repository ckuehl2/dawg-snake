<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dawg Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1a0f;
    --panel: #12261a;
    --green: #1f6b22;
    --green-dark: #0d3d12;
    --red: #8b0d0d;
    --text: #e8f3ea;
    --muted: #8fb196;
    --line: rgba(255,255,255,.12);
    --gold: #f5c518;
    color-scheme: dark; /* the game commits to one dark look */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #163a1f 0%, var(--bg) 60%) var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    padding-block: 16px; padding-inline: 16px;
    user-select: none; -webkit-user-select: none;
  }
  .app { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 24px; }
  .play { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(100%, 624px); }
  h1 {
    margin: 0; font-family: 'UnifrakturCook', serif; font-size: clamp(28px, 6vw, 44px);
    letter-spacing: 1px; color: #fff; text-shadow: 0 2px 0 var(--green-dark), 0 0 18px rgba(60,180,70,.35);
  }
  #hud {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 15px;
  }
  #hud .stat span { color: #fff; font-weight: 800; font-size: 18px; margin-left: 4px; }
  #effects { width: 100%; height: 28px; display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #effects::-webkit-scrollbar { display: none; }
  .effect {
    display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border-radius: 999px;
    background: var(--panel); border: 1px solid rgba(255,255,255,.12); font-size: 13px; font-weight: 600;
    position: relative; overflow: hidden; white-space: nowrap; flex-shrink: 0;
  }
  .effect .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: currentColor; opacity: .8; }
  #wrap { position: relative; width: min(100%, 624px, max(300px, calc(100vh - 190px))); max-width: 100%; aspect-ratio: 1; touch-action: none; }
  canvas {
    width: 100%; height: 100%; display: block; border-radius: 12px;
    border: 3px solid #000; box-shadow: 0 0 0 3px var(--green), 0 12px 40px rgba(0,0,0,.6);
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(5,15,8,.82); border-radius: 12px; text-align: center; padding: 20px; overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-family: 'UnifrakturCook', serif; font-size: clamp(30px, 7vw, 52px); }
  #overlay p { margin: 0; color: var(--muted); max-width: 380px; line-height: 1.5; }
  button {
    font: 800 17px Inter, sans-serif; color: #fff; background: var(--green); border: 3px solid #000;
    border-radius: 10px; padding: 10px 26px; cursor: pointer; box-shadow: 0 4px 0 #000;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
  .hint { font-size: 13px; color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button.small { font-size: 14px; padding: 8px 14px; box-shadow: 0 3px 0 #000; }

  /* post-score form on the game-over screen */
  #postForm { display: flex; flex-direction: column; gap: 6px; width: min(100%, 320px); }
  #postForm label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; }
  .post-row { display: flex; gap: 8px; }
  #playerName {
    flex: 1; min-width: 0; font: 600 16px Inter, sans-serif; color: var(--text); background: var(--bg);
    border: 2px solid var(--line); border-radius: 8px; padding: 8px 10px; user-select: text; -webkit-user-select: text;
  }
  #postMsg { min-height: 1.2em; margin: 0; }

  /* leaderboard */
  .board {
    flex: 0 1 300px; width: min(100%, 300px); background: var(--panel); border: 2px solid #000;
    box-shadow: 0 0 0 2px var(--green); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .board h2 { margin: 0; font-family: 'UnifrakturCook', serif; font-size: 30px; color: #fff; text-wrap: balance; }
  .board-sub { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
  #lbList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #lbList li {
    display: grid; grid-template-columns: 30px 1fr auto auto; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; font-size: 15px;
  }
  #lbList li:nth-child(odd) { background: rgba(255,255,255,.03); }
  #lbList li.me { background: rgba(31,107,34,.35); outline: 1px solid var(--green); }
  .rank {
    width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; border: 2px solid #000;
    background: var(--bg); color: var(--muted); font: 700 17px 'UnifrakturCook', serif;
  }
  li:nth-child(1) .rank { background: var(--red); color: #000; }
  li:nth-child(2) .rank, li:nth-child(3) .rank { background: var(--green-dark); color: #fff; }
  .lb-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .lb-name small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .lb-score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .lb-ach { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lb-name.gold { color: var(--gold); text-shadow: 0 0 8px rgba(245,197,24,.55); }
  .lb-name.gold::before { content: '👑 '; }
  .lb-ach.gold { color: var(--gold); }
  /* achievements */
  .below { width: 100%; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
  .skins { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .skins span { font-size: 13px; font-weight: 600; color: var(--muted); margin-right: 2px; }
  .skin {
    width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid #000;
    box-shadow: 0 2px 0 #000; background: var(--swatch);
  }
  .skin[aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 2px; }
  #achBtn { background: var(--panel); border-color: #000; }
  #achBtn[aria-expanded="true"] { background: var(--green-dark); }
  .ach-panel {
    width: 100%; background: var(--panel); border: 2px solid #000; box-shadow: 0 0 0 2px var(--green);
    border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .ach-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .ach-head h2 { margin: 0; font-family: 'UnifrakturCook', serif; font-size: 28px; color: #fff; }
  .ach-head p { margin: 0; font-size: 13px; color: var(--muted); }
  #achList { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  #achList li {
    display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 8px 10px;
    border-radius: 10px; background: var(--bg); border: 1px solid var(--line); min-width: 0;
  }
  #achList li.done { border-color: var(--gold); background: rgba(245,197,24,.08); }
  #achList .ach-icon { font-size: 26px; text-align: center; }
  #achList li:not(.done) .ach-icon { filter: grayscale(1); opacity: .45; }
  #achList strong { display: block; font-size: 14px; color: #fff; }
  #achList li:not(.done) strong { color: var(--muted); }
  #achList span.ach-desc { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
  .ach-progress { height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .ach-progress i { display: block; height: 100%; background: var(--gold); }
  button.link { background: none; border: none; box-shadow: none; color: var(--muted); font: 600 13px Inter, sans-serif; padding: 4px; text-decoration: underline; }
  button.link:active { transform: none; }
  #ovAch { color: var(--gold); font-weight: 600; max-width: 380px; margin: 0; line-height: 1.5; }
  #toasts { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 5; pointer-events: none; width: max-content; max-width: calc(100% - 24px); }
  .toast {
    display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center;
    background: #111; color: #fff; border: 2px solid var(--gold); border-radius: 12px; padding: 8px 14px 8px 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: toast-in .35s ease-out, toast-out .4s ease-in 3.2s forwards;
  }
  .toast .ach-icon { font-size: 28px; }
  .toast small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
  .toast strong { font-size: 15px; }
  @keyframes toast-in { from { transform: translateY(-20px); opacity: 0; } }
  @keyframes toast-out { to { transform: translateY(-20px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  kbd { background: var(--panel); border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
</style>
</head>
<body>
<main class="app">
<section class="play">
  <h1>Dawg Snake</h1>
  <div id="hud">
    <div class="stat">Score <span id="score">0</span></div>
    <div class="stat">Length <span id="length">3</span></div>
    <div class="stat">Best <span id="best">0</span></div>
  </div>
  <div id="effects"></div>
  <div id="wrap">
    <canvas id="game" width="624" height="624"></canvas>
    <div id="toasts" aria-live="polite"></div>
    <div id="overlay">
      <h2 id="ovTitle">Dawg Snake</h2>
      <p id="ovText">Guide the dawg and devour every red D. Don't hit the walls or your own tail.</p>
      <p id="ovAch" hidden></p>
      <form id="postForm" hidden>
        <label for="playerName">Name for the leaderboard</label>
        <div class="post-row">
          <input id="playerName" maxlength="20" autocomplete="nickname" placeholder="Your name" required>
          <button type="submit" class="small" id="postBtn">Post score</button>
        </div>
        <p id="postMsg" class="hint"></p>
      </form>
      <button id="ovBtn">Play</button>
      <div class="hint"><kbd>←↑→↓</kbd> / <kbd>WASD</kbd> to move · <kbd>Space</kbd> to pause · <kbd>M</kbd> mute · swipe on mobile</div>
    </div>
  </div>
  <div class="below">
    <div class="skins" id="skins" role="group" aria-label="Dawg color"><span>Dawg color</span></div>
    <button id="achBtn" class="small" aria-expanded="false" aria-controls="achPanel">🏆 Achievements <span id="achCount"></span></button>
  </div>
  <section id="achPanel" class="ach-panel" hidden aria-labelledby="achTitle">
    <div class="ach-head">
      <h2 id="achTitle">Achievements</h2>
      <p>Saved in this browser. <button id="achReset" class="link" type="button">Reset</button></p>
    </div>
    <ul id="achList"></ul>
  </section>
</section>

<aside class="board" aria-labelledby="lbTitle">
  <h2 id="lbTitle">Leaderboard</h2>
  <p class="board-sub" id="lbStatus">Loading scores…</p>
  <ol id="lbList"></ol>
</aside>
</main>

<script>
'use strict';

/* =====================================================================
   CONFIG
   ===================================================================== */
const CONFIG = {
  cols: 24,
  rows: 24,
  cell: 26,               // pixels per cell (canvas = cols * cell)
  startLength: 3,
  baseTickMs: 120,        // ms per move at start
  minTickMs: 60,          // fastest the base speed can get
  speedUpEvery: 5,        // every N Ds eaten...
  speedUpMs: 6,           // ...shave this many ms off the tick
  pointsPerD: 10,
  powerUpSpawnChance: 0.7,  // chance a power-up appears each time a D is eaten
  powerUpEveryMs: 4000,     // also drop one on a timer, even if you're not eating
  maxPowerUpsOnBoard: 2,
};

/* =====================================================================
   POWER-UPS
   ---------------------------------------------------------------------
   To add a power-up, push an object into POWER_UPS. Every field except
   id/name/color is optional.

   {
     id:        'unique-id',
     name:      'Shown in HUD',
     color:     '#hex',            // pickup glow + HUD chip color
     type:      'buff',            // 'buff' | 'debuff' (looks the same on the board; helpers like Simon skip debuffs)
     icon:      '⚡',               // emoji drawn on the board (or use draw())
     draw(ctx, x, y, size, t){},   // optional custom board sprite
     drawOverlay(ctx, game, effect){}, // draw on top of the whole board while active
     drawHead(ctx, game, effect, size){ return true; }, // replace the dawg's head (ctx is head-local)
     decorateHead(ctx, game, effect, size){},           // draw extras on the head (hats, shades...)
     drawItem(ctx, game, effect, item, x, y, size){ return true; }, // restyle board items (return false to keep the default)
     overlayLayer: 0,              // higher overlays draw on top of lower ones
     weight:    1,                 // relative spawn likelihood
     lifetime:  8000,              // ms it stays on the board before vanishing
     duration:  5000,              // ms the effect lasts (0 = instant, one-shot)
     enabled:   true,

     // Passive modifiers while active (multiplied together if stacked):
     modifiers: { speed: 1.5, score: 2 },  // speed>1 = faster

     // Lifecycle hooks (all receive the game object). `effect` is the live
     // effect record ({ def, remaining }) — stash per-run state on it.
     onActivate(game, effect){},
     onDeactivate(game, effect){},
     onBeforeStep(game, effect){}, // right before each move (e.g. steer via game.dirQueue)
     onTick(game, effect){},       // every snake move while active
     onEat(game, effect, item){},  // when the dawg eats a D while active

     // Return true to cancel a death (walls wrap around, self passes through),
     // or { x, y, dir } to send the dawg somewhere specific. kind = 'wall' | 'self'
     onCollide(game, kind, head, effect){ return false; },
   }

   Handy game API for hooks: game.grow(n), game.shrink(n), game.addScore(n),
   game.spawnFood(), game.freeCell(filter?), game.gameOver(reason?), game.snake, game.dir, game.items, game.effects,
   game.isActive(id), game.particles(x, y, color, count), game.time,
   game.headPx() (head center in canvas pixels), Sound.tone(...), Sound.noise(...).
   ===================================================================== */
const POWER_UPS = [
  {
    id: 'super-sharkey-speed',
    name: 'Super Sharkey Speed',
    color: '#1e90ff',
    icon: '🦈',
    weight: 1,
    lifetime: 8000,
    duration: 5000,
    enabled: true,
    modifiers: { speed: 1.6, score: 2 },

    // Board sprite: a shark fin cruising through a little pool of water.
    draw(ctx, x, y, size, t) {
      const r = size * 0.48 * (1 + Math.sin(t / 150) * 0.08);
      ctx.save();
      ctx.shadowColor = '#1e90ff'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#1e90ff';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r - 1, 0, Math.PI * 2); ctx.clip();
      // fin slides back and forth
      const fx = x + Math.sin(t / 300) * size * 0.12, base = y + size * 0.12;
      ctx.fillStyle = '#5f7380'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(fx - size * 0.24, base);
      ctx.quadraticCurveTo(fx - size * 0.02, base - size * 0.2, fx + size * 0.1, base - size * 0.36);
      ctx.quadraticCurveTo(fx + size * 0.06, base - size * 0.14, fx + size * 0.2, base);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // wave line
      ctx.strokeStyle = '#bfe6ff'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = -0.5; i <= 0.5; i += 0.05) {
        const wx = x + i * size, wy = base + Math.sin(i * 14 + t / 120) * size * 0.04;
        i === -0.5 ? ctx.moveTo(wx, wy) : ctx.lineTo(wx, wy);
      }
      ctx.stroke();
      ctx.restore();
    },

    onActivate(game) {
      const h = game.snake[0];
      game.particles(h.x, h.y, '#bfe6ff', 24); // big splash on pickup
      Sound.noise(0.35, 0.18, 900); // splash
      // something big is circling: dun-dun... dun-dun
      [0, 0.3, 0.75, 0.95].forEach((d, i) =>
        Sound.tone(Sound.midi(i % 2 ? 41 : 40), 0.22, { type: 'sawtooth', vol: 0.12, filter: 500, delay: d }));
    },
    // Leave a trail of sea spray behind the dawg while it's speeding.
    onTick(game) {
      const tail = game.snake[game.snake.length - 1];
      game.particles(tail.x, tail.y, Math.random() < 0.5 ? '#7fd3ff' : '#ffffff', 3);
    },
  },

  /* ---------------- DEBUFFS ---------------- */

  // Lights out, Gotham style: only a small circle around the dawg stays lit.
  {
    id: 'darman-darkness',
    name: 'Darman Darkness',
    type: 'debuff',
    color: '#f5c518',
    icon: '🦇',
    weight: 1,
    lifetime: 8000,
    duration: 6000,
    overlayLayer: 0,

    // Board sprite: the Bat-signal.
    draw(ctx, x, y, size, t) {
      const r = size * 0.48 * (1 + Math.sin(t / 150) * 0.06);
      ctx.save();
      ctx.shadowColor = '#f5c518'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#f5c518';
      ctx.beginPath(); ctx.ellipse(x, y, r * 0.82, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#000';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#000';
      Sprites.bat(ctx, x, y, size * 0.72, 1);
    },

    onActivate(game) {
      const h = game.snake[0];
      game.particles(h.x, h.y, '#1a1a2e', 26);
      Sound.tone(110, 0.5, { type: 'sawtooth', vol: 0.12, slideTo: 55 }); // dun-dun
    },

    drawOverlay(ctx, game, fx) {
      const W = ctx.canvas.width, H = ctx.canvas.height, c = CONFIG.cell;
      const elapsed = fx.def.duration - fx.remaining;
      const fade = Math.min(1, elapsed / 400, fx.remaining / 600);
      const [hx, hy] = game.headPx();

      // darkness with a flashlight hole around the dawg
      const g = ctx.createRadialGradient(hx, hy, c * 1.2, hx, hy, c * 4);
      g.addColorStop(0, 'rgba(5,5,15,0)');
      g.addColorStop(1, `rgba(5,5,15,${0.95 * fade})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Bat-signal shining in the night sky
      ctx.save();
      ctx.globalAlpha = 0.55 * fade;
      const sx = W * 0.8, sy = H * 0.14;
      const beam = ctx.createLinearGradient(W * 0.95, H, sx, sy);
      beam.addColorStop(0, 'rgba(245,197,24,0)');
      beam.addColorStop(1, 'rgba(245,197,24,0.35)');
      ctx.fillStyle = beam;
      ctx.beginPath(); ctx.moveTo(W * 0.93, H); ctx.lineTo(sx - c * 2.6, sy); ctx.lineTo(sx + c * 2.6, sy); ctx.lineTo(W * 0.97, H); ctx.fill();
      ctx.fillStyle = '#f5c518';
      ctx.beginPath(); ctx.ellipse(sx, sy, c * 2.6, c * 1.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#05050f';
      Sprites.bat(ctx, sx, sy, c * 4.2, 1);
      ctx.restore();

      // bats flapping across the screen
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.fillStyle = '#000';
      ctx.strokeStyle = 'rgba(150,130,255,.6)'; ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const x = ((game.time * (0.07 + i * 0.012) + i * 173) % (W + 120)) - 60;
        const y = H * (0.15 + i * 0.14) + Math.sin(game.time / 260 + i * 2) * c;
        Sprites.bat(ctx, x, y, c * 1.6, Math.sin(game.time / 70 + i));
        ctx.stroke();
      }
      ctx.restore();
    },
  },

  // A barrage of sportsballs flies over the board and blocks your view.
  {
    id: 'ians-sportsballs',
    name: "Ian's Sportsballs",
    type: 'debuff',
    color: '#ff7a00',
    icon: '🏀',
    weight: 1,
    lifetime: 8000,
    duration: 6000,
    overlayLayer: 1,
    balls: ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🏉', '🥎'],

    onActivate(game, fx) {
      fx.flying = []; fx.nextSpawn = game.time; fx.lastT = game.time;
      Sound.noise(0.15, 0.25); // whistle-ish thump
      Sound.tone(1800, 0.35, { type: 'square', vol: 0.05 });
    },

    drawOverlay(ctx, game, fx) {
      const W = ctx.canvas.width, H = ctx.canvas.height, c = CONFIG.cell;
      const dt = game.state === 'playing' ? game.time - fx.lastT : 0;
      fx.lastT = game.time;

      if (game.state === 'playing' && fx.remaining > 900) {
        while (fx.nextSpawn <= game.time) {
          fx.nextSpawn += 110;
          const side = Math.floor(Math.random() * 4), m = c * 2;
          const start = [[-m, Math.random() * H], [W + m, Math.random() * H], [Math.random() * W, -m], [Math.random() * W, H + m]][side];
          const target = [W * (0.2 + Math.random() * 0.6), H * (0.2 + Math.random() * 0.6)];
          const ang = Math.atan2(target[1] - start[1], target[0] - start[0]);
          const sp = 0.25 + Math.random() * 0.3;

      const ok = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows && !blocked.has(key(x, y));
      const all = Object.values(DIRS);
      const dirs = all.filter(d => !(d.x === -game.dir.x && d.y === -game.dir.y));
      const goals = new Set(game.items.filter(i => i.kind === 'food').map(i => key(i.x, i.y)));

      const seen = new Set([key(h.x, h.y)]), q = [];
      for (const d of dirs) {
        const x = h.x + d.x, y = h.y + d.y;
        if (ok(x, y)) { seen.add(key(x, y)); q.push([x, y, d]); }
      }
      let pick = null;
      for (let i = 0; i < q.length && !pick; i++) {
        const [x, y, first] = q[i];

        for (const e of all) {
          const nx = x + e.x, ny = y + e.y, k = key(nx, ny);

          }

  // Carter's trombone: every few steps a big BWAAAP blasts straight ahead and eats the Ds in its path.

    // headset for relaying the play calls
    decorateHead(ctx, game, fx, u) {
      ctx.strokeStyle = '#212121'; ctx.lineWidth = u * 0.06;
      ctx.beginPath(); ctx.arc(-0.05 * u, -0.05 * u, u * 0.42, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.fillStyle = '#212121';
      ctx.beginPath(); ctx.arc(-0.42 * u, -0.12 * u, u * 0.1, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath(); ctx.moveTo(-0.4 * u, -0.05 * u); ctx.quadraticCurveTo(-0.2 * u, 0.4 * u, 0.25 * u, 0.25 * u); ctx.stroke();
    },

    drawOverlay(ctx, game, fx) {
      const W = ctx.canvas.width, H = ctx.canvas.height, c = CONFIG.cell;

      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      // marker plays
      ctx.globalAlpha = 0.75 * fade;
      ctx.strokeStyle = '#0c2340'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (const m of fx.marks) {
        const x = m.x * W, y = m.y * H, r = c * 0.55;
        ctx.beginPath();
        if (m.o) ctx.arc(x, y, r, 0, Math.PI * 2);

        ctx.stroke();
        // route arrow

        ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(a + 0.5) * c * 0.4, ey - Math.sin(a + 0.5) * c * 0.4);
        ctx.stroke();
      }
      // banner
      ctx.globalAlpha = fade;
      ctx.font = `800 ${c * 0.6}px Inter, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const text = '📋 PLAY CALLS RELAYED LATE';

    icon: '🛏️',
    weight: 1,
    lifetime: 8000,
    duration: 7000,
    overlayLayer: 9, // drawn last, so the shake moves everything

    onActivate(game, fx) {
      fx.n = 0; fx.t0 = game.time; fx.shakeUntil = game.time + 600; fx.hopAt = -1e9;
      fx.cracks = Array.from({ length: 5 }, () => {
        let x = Math.random(), y = Math.random(), a = Math.random() * Math.PI * 2;
        const pts = [[x, y]];
        for (let i = 0; i < 6; i++) { a += (Math.random() - 0.5) * 1.4; x += Math.cos(a) * 0.07; y += Math.sin(a) * 0.07; pts.push([x, y]); }
        return pts;
      });
      fx.feathers = Array.from({ length: 14 }, () => ({ x: Math.random(), y: -Math.random() * 0.6, sway: Math.random() * 6, sp: 0.00004 + Math.random() * 0.00006 }));
      fx.lastT = game.time;
      Sound.noise(0.5, 0.35, 200);  // CRACK
      Sound.tone(90, 0.5, { type: 'square', vol: 0.1, slideTo: 40 });
    },

    // the springs fire: one extra step forward, right now
    onTick(game, fx) {
      if (fx.hopping || ++fx.n % fx.def.hopEvery) return;
      fx.hopping = true;
      fx.hopAt = game.time; fx.shakeUntil = game.time + 250;
      Sound.tone(220, 0.2, { type: 'sine', vol: 0.1, slideTo: 660 }); // boing
      game.step();
      fx.hopping = false;
      if (game.state === 'playing') game.emit('springHop');
    },

    onDeactivate(game, fx) {
      if (fx && game.state === 'playing') game.emit('bedSurvived');
    },

    drawOverlay(ctx, game, fx) {
      const W = ctx.canvas.width, H = ctx.canvas.height, c = CONFIG.cell;
      const playing = game.state === 'playing';
      const dt = playing ? game.time - fx.lastT : 0;
      fx.lastT = game.time;
      const fade = Math.min(1, fx.remaining / 600);
      ctx.globalAlpha = fade;
      // cracks in the frame
      ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      for (const pts of fx.cracks) {
        ctx.beginPath();
        pts.forEach(([x, y], i) => (i ? ctx.lineTo(x * W, y * H) : ctx.moveTo(x * W, y * H)));
        ctx.stroke();
      }
      // pillow feathers drifting down
      ctx.font = `${c * 0.8}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const f of fx.feathers) {
        f.y += f.sp * dt; if (f.y > 1.1) f.y = -0.1;
        ctx.save();
        ctx.translate(f.x * W + Math.sin(game.time / 500 + f.sway) * c, f.y * H);
        ctx.rotate(Math.sin(game.time / 400 + f.sway) * 0.6);
        ctx.fillStyle = '#000'; ctx.fillText('🪶', 0, 0);
        ctx.restore();
      }
      // CRACK! / BOING! banners
      const banner = (text, at, ms, color) => {
        const since = game.time - at;
        if (since >= ms) return;
        ctx.globalAlpha = Math.min(1, (ms - since) / 300) * fade;
        ctx.font = `900 ${c * 1.6}px Inter, sans-serif`; ctx.lineJoin = 'round';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 8; ctx.fillStyle = color;
        ctx.strokeText(text, W / 2, H * 0.3); ctx.fillText(text, W / 2, H * 0.3);
      };
      banner('CRACK! 🛏️💥', fx.t0, 1300, '#ffccbc');
      banner('BOING!', fx.hopAt, 450, '#fff59d');
      ctx.globalAlpha = 1;
      // the whole bed frame shakes
      if (game.time < fx.shakeUntil) {
        const m = c * 0.25, dx = (Math.random() - 0.5) * m * 2, dy = (Math.random() - 0.5) * m * 2;
        ctx.drawImage(ctx.canvas, dx, dy);
      }
    },
  },
];

    g.strokeStyle = '#000'; g.lineWidth = s * 0.06; g.stroke();

    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `700 ${s * 1.02}px 'UnifrakturCook', 'Old English Text MT', serif`;
    g.fillText('D', s * 0.5, s * 0.6);
    this.food = c;
  },

  // Scottie dawg head, facing right, in a unit box centered at 0,0.
  dawgHead(ctx, size) {
    const u = size;
    const P = (pts) => { ctx.beginPath(); ctx.moveTo(pts[0][0]*u, pts[0][1]*u); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0]*u, pts[i][1]*u); ctx.closePath(); };

    const head = [
      [-0.55, 0.42], [-0.5, -0.05], [-0.42, -0.62], [-0.22, -0.2], [-0.08, -0.68],
      [0.06, -0.18], [0.24, -0.16], [0.3, -0.24], [0.36, -0.12], [0.58, -0.08],
      [0.62, 0.06], [0.52, 0.12], [0.55, 0.3], [0.46, 0.24], [0.44, 0.52],
      [0.34, 0.34], [0.28, 0.56], [0.18, 0.34], [0.1, 0.5], [0.02, 0.3], [-0.2, 0.36],
    ];
    ctx.lineJoin = 'round';
    P(head);
    ctx.fillStyle = Skins.current.body; ctx.fill();
    ctx.lineWidth = u * 0.065; ctx.strokeStyle = '#000'; ctx.stroke();

    // white fur highlights
    ctx.fillStyle = '#fff';
    P([[-0.36, -0.42], [-0.28, -0.24], [-0.36, -0.12]]); ctx.fill();
    P([[-0.03, -0.46], [0.02, -0.22], [-0.06, -0.14]]); ctx.fill();
    P([[-0.42, 0.05], [-0.22, -0.05], [-0.3, 0.3], [-0.45, 0.32]]); ctx.fill();
    // beard streaks
    ctx.strokeStyle = '#fff'; ctx.lineWidth = u * 0.045; ctx.lineCap = 'round';
    [[0.38, 0.12, 0.4, 0.42], [0.27, 0.1, 0.27, 0.46], [0.16, 0.12, 0.13, 0.38]].forEach(([a, b, c, d]) => {
      ctx.beginPath(); ctx.moveTo(a*u, b*u); ctx.lineTo(c*u, d*u); ctx.stroke();
    });
    // bushy brow
    ctx.fillStyle = '#fff';
    P([[0.08, -0.12], [0.3, -0.2], [0.26, -0.06]]); ctx.fill();
    // eye
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(0.2*u, -0.02*u, u*0.055, 0, Math.PI*2); ctx.fill();
    // nose
    ctx.beginPath(); ctx.ellipse(0.58*u, -0.01*u, u*0.07, u*0.06, 0, 0, Math.PI*2); ctx.fill();
  },

  // Bat silhouette centered at x,y, w wide. flap (-1..1) bends the wings. Fills with current fillStyle.
  bat(ctx, x, y, w, flap = 1) {
    const half = [[0, -0.1], [0.04, -0.2], [0.06, -0.1], [0.14, -0.12], [0.3, -0.22], [0.5, -0.05],
      [0.4, 0.0], [0.33, 0.12], [0.22, 0.04], [0.13, 0.14], [0.05, 0.06], [0, 0.2]];
    const pt = ([px, py]) => [x + px * w, y + (Math.abs(px) > 0.1 ? py * flap : py) * w];
    ctx.beginPath();
    half.forEach((p, i) => { const [a, b] = pt(p); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); });
    for (let i = half.length - 1; i >= 0; i--) { const [a, b] = pt([-half[i][0], half[i][1]]); ctx.lineTo(a, b); }
    ctx.closePath(); ctx.fill();
  },
};

  { id: 'red',    name: 'Fire Red',         body: '#b71c1c', stripe: '#e53935' },
  { id: 'purple', name: 'Royal Purple',     body: '#5e2a9c', stripe: '#8a52d1' },
  { id: 'orange', name: 'Blaze Orange',     body: '#e65100', stripe: '#ff8a3d' },
  { id: 'pink',   name: 'Hot Pink',         body: '#d81b77', stripe: '#ff5fa8' },
  { id: 'ice',    name: 'Ice Blue',         body: '#1e88c7', stripe: '#6cc6f5' },
  { id: 'black',  name: 'Midnight',         body: '#262626', stripe: '#4d4d4d' },
  { id: 'white',  name: 'Snow',             body: '#d9d9d9', stripe: '#f5f5f5' },
];
const Skins = {
  KEY: 'dawgSnakeSkin',
  current: SKINS[0],
  load() {
    let id = null;
    try { id = localStorage.getItem(this.KEY); } catch {}
    this.current = SKINS.find(s => s.id === id) || SKINS[0];

      b.addEventListener('click', () => { this.pick(s); b.blur(); }); // blur so Space keeps controlling the game
      box.append(b);
    }
    this.render();
  },
  pick(s) {

    try { localStorage.setItem(this.KEY, s.id); } catch {}
    this.render();

  render() {
    [...$('skins').querySelectorAll('.skin')].forEach((b, i) => b.setAttribute('aria-pressed', String(SKINS[i] === this.current)));
  },
};

/* =====================================================================
   SOUND  (tiny Web Audio synth — press M to mute)
   ===================================================================== */
const Sound = {
  ctx: null,
  muted: (() => { try { return localStorage.getItem('dawgSnakeMuted') === '1'; } catch { return false; } })(),
  unlock() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch {}
  },
  toggleMute() {
    this.muted = !this.muted;
    try { localStorage.setItem('dawgSnakeMuted', this.muted ? '1' : '0'); } catch {}
    return this.muted;
  },
  midi: n => 440 * Math.pow(2, (n - 69) / 12),
  tone(freq, dur, { type = 'triangle', vol = 0.15, attack = 0.01, delay = 0, filter = 0, slideTo = 0 } = {}) {
    if (this.muted || !this.ctx) return;
    const a = this.ctx, t = a.currentTime + delay;
    const osc = a.createOscillator(), gain = a.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (filter) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter; osc.connect(f); node = f; }
    node.connect(gain).connect(a.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(dur, vol = 0.1, highpass = 0) {
    if (this.muted || !this.ctx) return;
    const a = this.ctx, t = a.currentTime;
    const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = a.createBufferSource(), gain = a.createGain();
    src.buffer = buf; gain.gain.value = vol;
    let node = src;
    if (highpass) { const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = highpass; src.connect(f); node = f; }
    node.connect(gain).connect(a.destination);
    src.start(t);
  },
};

/* =====================================================================
   GAME
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.cols * CONFIG.cell;
canvas.height = CONFIG.rows * CONFIG.cell;

const DIRS = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };

function loadBest() { try { return +localStorage.getItem('dawgSnakeBest') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('dawgSnakeBest', v); } catch {} }

const game = {
  state: 'menu', // menu | playing | paused | over
  snake: [], dir: DIRS.right, dirQueue: [],
  items: [], effects: [], fx: [],
  score: 0, eaten: 0, pendingGrowth: 0,
  best: loadBest(),
  baseTick: CONFIG.baseTickMs, acc: 0, last: 0, time: 0,

  /* ---------- lifecycle ---------- */
  reset() {
    const cy = Math.floor(CONFIG.rows / 2), cx = Math.floor(CONFIG.cols / 3);
    this.snake = [];
    for (let i = 0; i < CONFIG.startLength; i++) this.snake.push({ x: cx - i, y: cy });
    this.dir = DIRS.right; this.dirQueue = [];
    this.items = []; this.fx = [];
    this.effects.forEach(e => e.def.onDeactivate?.(this, e));
    this.effects = [];
    this.score = 0; this.eaten = 0; this.pendingGrowth = 0; this.alive = 0;
    this.baseTick = CONFIG.baseTickMs; this.acc = 0;
    this.nextPowerUpAt = this.time + CONFIG.powerUpEveryMs;
    this.spawnFood();
    updateHud();
  },
  start() { Sound.unlock(); this.reset(); this.state = 'playing'; hideOverlay(); Leaderboard.hidePost(); Achievements.startRun(); },
  emit(event, data = {}) { Achievements.emit(event, data); }, // achievement events (see ACHIEVEMENTS)
  pause() {
    if (this.state === 'playing') { this.state = 'paused'; Leaderboard.hidePost(); showOverlay('Paused', 'Take a breather.', 'Resume'); }
    else if (this.state === 'paused') { this.state = 'playing'; hideOverlay(); }
  },
  gameOver(reason = '') {
    if (this.state === 'over') return;
    this.state = 'over';
    const head = this.snake[0];
    this.particles(head.x, head.y, Skins.current.body, 30);
    if (this.score > this.best) { this.best = this.score; saveBest(this.best); }
    updateHud();
    [[60, 0], [56, 0.18], [51, 0.36]].forEach(([n, d]) =>
      Sound.tone(Sound.midi(n), d ? 0.3 : 0.2, { type: 'square', vol: 0.06, filter: 1800, delay: d }));
    this.emit('over', { reason });
    Leaderboard.offerPost(this.score, this.eaten);
    showOverlay('Game Over', `${reason ? reason + ' ' : ''}The dawg ate ${this.eaten} D${this.eaten === 1 ? '' : 's'} for ${this.score} points.`, 'Play Again');
    Achievements.showRunSummary();
  },

  /* ---------- modifiers ---------- */
  modifier(key) {
    return this.effects.reduce((m, e) => m * (e.def.modifiers?.[key] ?? 1), 1);
  },
  tickMs() { return this.baseTick / this.modifier('speed'); },
  isActive(id) { return this.effects.some(e => e.def.id === id); },

  /* ---------- helpers for power-ups ---------- */
  grow(n = 1) { this.pendingGrowth += n; },
  shrink(n = 1) { for (let i = 0; i < n && this.snake.length > 2; i++) this.snake.pop(); },
  addScore(n) { this.score += Math.round(n * this.modifier('score')); updateHud(); },

  freeCell(filter = () => true) {
    const taken = new Set([...this.snake, ...this.items].map(p => p.x + ',' + p.y));
    const free = [];
    for (let y = 0; y < CONFIG.rows; y++) for (let x = 0; x < CONFIG.cols; x++)
      if (!taken.has(x + ',' + y) && filter({ x, y })) free.push({ x, y });
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  },
  spawnFood() {
    const c = this.freeCell();
    if (c) this.items.push({ ...c, kind: 'food', born: this.time });
  },
  spawnPowerUp() {
    const pool = POWER_UPS.filter(p => p.enabled !== false);
    if (!pool.length) return;
    if (this.items.filter(i => i.kind === 'power').length >= CONFIG.maxPowerUpsOnBoard) return;
    const total = pool.reduce((s, p) => s + (p.weight ?? 1), 0);
    let r = Math.random() * total, def = pool[0];
    for (const p of pool) { r -= p.weight ?? 1; if (r <= 0) { def = p; break; } }
    const c = this.freeCell();
    if (!c) return;
    this.items.push({ ...c, kind: 'power', def, born: this.time });
    Sound.tone(660, 0.1, { type: 'sine', vol: 0.05, slideTo: 990 }); // pop
  },
  activate(def) {
    const existing = this.effects.find(e => e.def.id === def.id);
    if (!def.duration) def.onActivate?.(this, null);             // instant
    else if (existing) existing.remaining = def.duration;         // refresh timer
    else {
      const effect = { def, remaining: def.duration };
      this.effects.push(effect);
      def.onActivate?.(this, effect);
    }
    this.emit('powerup', { def });
  },
  headPx() {
    const h = this.snake[0], c = CONFIG.cell;
    return [h.x * c + c / 2, h.y * c + c / 2];
  },

  /* ---------- input ---------- */
  turn(name) {
    if (this.state === 'menu' || this.state === 'over') return;
    const d = DIRS[name];
    const last = this.dirQueue.length ? this.dirQueue[this.dirQueue.length - 1] : this.dir;
    if (d === last || (d.x === -last.x && d.y === -last.y)) return;
    if (this.dirQueue.length < 3) this.dirQueue.push(d);
  },

  /* ---------- simulation ---------- */
  step() {
    this.effects.forEach(e => e.def.onBeforeStep?.(this, e));
    if (this.dirQueue.length) this.dir = this.dirQueue.shift();
    const head = this.snake[0];
    let nx = head.x + this.dir.x, ny = head.y + this.dir.y;

    // walls
    if (nx < 0 || ny < 0 || nx >= CONFIG.cols || ny >= CONFIG.rows) {
      const rescue = this.collide('wall', { x: nx, y: ny });
      if (!rescue) return this.gameOver();
      if (typeof rescue === 'object') { // power-up chose where the dawg goes (e.g. a bounce)
        nx = rescue.x; ny = rescue.y;
        if (rescue.dir) this.dir = rescue.dir;
      } else {
        nx = (nx + CONFIG.cols) % CONFIG.cols; ny = (ny + CONFIG.rows) % CONFIG.rows; // default rescue = wrap
      }
    }
    // self (tail tip moves away this step unless growing)
    const body = this.pendingGrowth > 0 ? this.snake : this.snake.slice(0, -1);
    if (body.some(s => s.x === nx && s.y === ny) && !this.collide('self', { x: nx, y: ny })) return this.gameOver();

    this.snake.unshift({ x: nx, y: ny });
    if (this.pendingGrowth > 0) this.pendingGrowth--; else this.snake.pop();

    // pickups
    const idx = this.items.findIndex(i => i.x === nx && i.y === ny);
    if (idx >= 0) {
      const item = this.items.splice(idx, 1)[0];
      if (item.kind === 'food') this.eatD(item);
      else { this.activate(item.def); this.particles(nx, ny, item.def.color, 18); }
    }

    this.effects.forEach(e => e.def.onTick?.(this, e));
    if (this.state === 'playing') this.emit('step');
    updateHud();
  },
  collide(kind, head) {
    for (const e of this.effects) {
      const r = e.def.onCollide?.(this, kind, head, e);
      if (r) return r;
    }
    return false;
  },
  // `by` says who got it: 'dawg', or a helper like 'simon' or 'lacrosse'
  eatD(item, by = 'dawg') {
    this.eaten++;
    Sound.noise(0.07, 0.18, 1500); // chomp
    Sound.tone(240, 0.08, { type: 'square', vol: 0.04, slideTo: 120 });
    this.grow(1);
    this.addScore(CONFIG.pointsPerD);
    this.particles(item.x, item.y, '#c21414', 16);
    if (this.eaten % CONFIG.speedUpEvery === 0)
      this.baseTick = Math.max(CONFIG.minTickMs, this.baseTick - CONFIG.speedUpMs);
    this.effects.forEach(e => e.def.onEat?.(this, e, item));
    if (!this.items.some(i => i.kind === 'food')) this.spawnFood();
    if (Math.random() < CONFIG.powerUpSpawnChance) this.spawnPowerUp();
    this.emit('eat', { item, by });
  },
  update(dt) {
    this.time += dt;
    // particles keep animating on game over too
    this.fx = this.fx.filter(p => (p.life -= dt) > 0);
    this.fx.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.0006 * dt; });
    if (this.state !== 'playing') return;
    this.alive += dt;

    // effect timers
    for (const e of this.effects) e.remaining -= dt;
    this.effects.filter(e => e.remaining <= 0).forEach(e => {
      e.def.onDeactivate?.(this, e);
      Sound.tone(700, 0.25, { type: 'triangle', vol: 0.04, slideTo: 250 }); // effect wears off
    });
    this.effects = this.effects.filter(e => e.remaining > 0);
    // power-ups vanish if ignored
    this.items = this.items.filter(i => i.kind !== 'power' || this.time - i.born < (i.def.lifetime ?? 8000));
    if (this.time >= this.nextPowerUpAt) {
      this.spawnPowerUp();
      this.nextPowerUpAt = this.time + CONFIG.powerUpEveryMs;
    }

    this.acc += dt;
    let guard = 0;
    while (this.acc >= this.tickMs() && this.state === 'playing' && guard++ < 5) {
      this.acc -= this.tickMs();
      this.step();
    }
    renderEffectsHud();
  },
  particles(gx, gy, color, count) {
    const c = CONFIG.cell;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.05 + Math.random() * 0.18;
      this.fx.push({ x: gx * c + c / 2, y: gy * c + c / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.08,
        life: 400 + Math.random() * 400, max: 800, color, size: 2 + Math.random() * 4 });
    }
  },
};

/* =====================================================================
   RENDER
   ===================================================================== */
function draw() {
  const { cols, rows, cell: c } = CONFIG;
  // checkered turf
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#e9efe6' : '#f6f9f4';
    ctx.fillRect(x * c, y * c, c, c);
  }

  // items
  for (const it of game.items) {
    const cx = it.x * c + c / 2, cy = it.y * c + c / 2;
    const skin = game.effects.find(e => e.def.drawItem);
    if (skin && skin.def.drawItem(ctx, game, skin, it, cx, cy, c)) continue;
    if (it.kind === 'food') {
      const bob = 1 + Math.sin(game.time / 220 + it.x) * 0.05;
      const s = c * 1.0 * bob;
      ctx.drawImage(Sprites.food, cx - s / 2, cy - s / 2, s, s);
    } else {
      const def = it.def, age = game.time - it.born, life = def.lifetime ?? 8000;
      if (life - age < 2000 && Math.floor(age / 120) % 2) continue; // blink before vanishing
      if (def.draw) { def.draw(ctx, cx, cy, c, game.time); continue; }
      const pulse = 1 + Math.sin(game.time / 150) * 0.1;
      ctx.save();
      ctx.shadowColor = def.color; ctx.shadowBlur = 14;
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(cx, cy, c * 0.45 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.font = `${c * 0.6}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.icon ?? '★', cx, cy + 1);
    }
  }

  // snake body (tail → neck), drawn as a thick connected ribbon with outline
  const s = game.snake;
  const tint = game.effects.find(e => e.def.color)?.def.color;
  const pts = s.map(p => [p.x * c + c / 2, p.y * c + c / 2]);
  const ribbon = (width, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = s.length - 1; i >= 0; i--) {
      // break the line where the snake wrapped around an edge
      const prev = s[i + 1];
      if (prev && (Math.abs(prev.x - s[i].x) > 1 || Math.abs(prev.y - s[i].y) > 1)) ctx.moveTo(...pts[i]);
      else if (i === s.length - 1) ctx.moveTo(...pts[i]);
      else ctx.lineTo(...pts[i]);
    }
    ctx.stroke();
  };
  if (tint) { ctx.save(); ctx.shadowColor = tint; ctx.shadowBlur = 16; ribbon(c * 0.86, tint); ctx.restore(); }
  ribbon(c * 0.86, '#000');
  ribbon(c * 0.66, Skins.current.body);
  // fur stripe + scruff
  ribbon(c * 0.16, Skins.current.stripe);
  for (let i = 2; i < s.length; i += 3) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(pts[i][0] - c * 0.12, pts[i][1] - c * 0.12, c * 0.08, 0, Math.PI * 2); ctx.fill();
  }

  // head
  if (s.length) {
    const [hx, hy] = pts[0];
    ctx.save();
    ctx.translate(hx, hy);
    const d = game.dir;
    if (d === DIRS.left) ctx.scale(-1, 1);
    else if (d === DIRS.up) ctx.rotate(-Math.PI / 2);
    else if (d === DIRS.down) ctx.rotate(Math.PI / 2);
    const size = c * 1.35;
    const custom = game.effects.find(e => e.def.drawHead);
    ctx.save();
    if (!custom || !custom.def.drawHead(ctx, game, custom, size)) Sprites.dawgHead(ctx, size);
    ctx.restore();
    game.effects.forEach(e => { if (e.def.decorateHead) { ctx.save(); e.def.decorateHead(ctx, game, e, size); ctx.restore(); } });
    ctx.restore();
  }

  // particles
  for (const p of game.fx) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // power-up screen overlays (darkness, flying balls, ice...)
  if (game.state !== 'over' && game.snake.length) {
    [...game.effects]
      .filter(e => e.def.drawOverlay)
      .sort((a, b) => (a.def.overlayLayer ?? 0) - (b.def.overlayLayer ?? 0))
      .forEach(e => { ctx.save(); e.def.drawOverlay(ctx, game, e); ctx.restore(); });
  }
}

/* =====================================================================
   UI
   ===================================================================== */
const $ = id => document.getElementById(id);
function updateHud() {
  $('score').textContent = game.score;
  $('length').textContent = game.snake.length;
  $('best').textContent = Math.max(game.best, game.score);
}
let lastEffectsKey = '';
function renderEffectsHud() {
  const key = game.effects.map(e => e.def.id).join();
  const box = $('effects');
  if (key !== lastEffectsKey) {
    lastEffectsKey = key;
    box.innerHTML = game.effects.map(e =>
      `<div class="effect" data-id="${e.def.id}" style="color:${e.def.color}">${e.def.icon ?? '★'}
        <span style="color:var(--text)">${e.def.name}</span><div class="bar"></div></div>`).join('');
  }
  for (const e of game.effects) {
    const bar = box.querySelector(`[data-id="${e.def.id}"] .bar`);
    if (bar) bar.style.width = (100 * e.remaining / e.def.duration) + '%';
  }
}

const KEYS = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
};
window.addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea')) return; // typing a name
  if (KEYS[e.code]) { e.preventDefault(); game.turn(KEYS[e.code]); return; }
  if (e.code === 'KeyM') { Sound.unlock(); Sound.toggleMute(); return; }
  if (e.code === 'Space' || e.code === 'Escape' || e.code === 'KeyP') {
    e.preventDefault();
    if (game.state === 'playing' || game.state === 'paused') game.pause();
    else if (e.code === 'Space') game.start();
  } else if (e.code === 'Enter' && game.state !== 'playing') {
    game.state === 'paused' ? game.pause() : game.start();
  }
});

// swipe controls
let touch0 = null;
$('wrap').addEventListener('touchstart', e => { touch0 = e.touches[0]; }, { passive: true });
$('wrap').addEventListener('touchend', e => {
  if (!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.clientX, dy = t.clientY - touch0.clientY;
  touch0 = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  game.turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});

/* =====================================================================
   ACHIEVEMENTS
   ---------------------------------------------------------------------
   Each achievement listens for game events and unlocks when its check
   returns true. Events come from game.emit(): 'eat', 'powerup', 'step',
   'over', plus power-up moments like 'touchdown', 'try', 'bounce'.
   A check gets (game, stats, data): stats are lifetime totals kept in
   this browser; data is whatever the event sent.

   To add one, push an entry:
     { id, icon, name, desc, on: { eventName: (game, stats, data) => bool } }
   Optional: goal + stat to show a progress bar (stats[stat] / goal),
   secret: true to hide the description until it's unlocked.
   ===================================================================== */

// Counts something within one activation of a power-up (resets next time it's picked up).
function countDuring(game, powerUpId, key) {
  const e = game.effects.find(e => e.def.id === powerUpId);
  if (!e) return 0;
  e.counts = e.counts || {};
  return (e.counts[key] = (e.counts[key] || 0) + 1);
}

const Achievements = {
  KEY: 'dawgSnakeAchievements',
  unlocked: {},                        // id -> unlock time
  stats: { games: 0, ds: 0, seen: [] }, // lifetime totals
  run: [],                             // unlocked during the current game

  load() {
    try {
      const saved = JSON.parse(localStorage.getItem(this.KEY) || 'null');
      if (saved) { this.unlocked = saved.unlocked || {}; this.stats = { ...this.stats, ...saved.stats }; }
    } catch {}
    this.render();
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify({ unlocked: this.unlocked, stats: this.stats })); } catch {}
  },

  startRun() { this.run = []; $('ovAch').hidden = true; },
  count() { return ACHIEVEMENTS.filter(a => this.unlocked[a.id]).length; },

  emit(event, data) {
    const s = this.stats;
    if (event === 'eat') s.ds++;
    if (event === 'over') s.games++;
    if (event === 'powerup' && !s.seen.includes(data.def.id)) s.seen.push(data.def.id);
    s.seenCount = s.seen.length;

    for (const a of ACHIEVEMENTS) {
      const check = a.on[event];
      if (!check || this.unlocked[a.id]) continue;
      if (check(game, s, data)) this.unlock(a);
    }
    if (event === 'over' || event === 'powerup' || s.ds % 10 === 0) this.save();
  },

  unlock(a) {
    this.unlocked[a.id] = Date.now();
    this.run.push(a);
    this.save();
    this.render();
    this.toast(a);
    [72, 76, 79, 84].forEach((n, i) => Sound.tone(Sound.midi(n), i === 3 ? 0.4 : 0.12, { type: 'triangle', vol: 0.07, delay: i * 0.08 }));
  },

  queue: [],
  toast(a) {
    if ($('toasts').children.length >= 2) { this.queue.push(a); return; } // two on screen at a time
    const t = document.createElement('div');
    t.className = 'toast';
    const icon = document.createElement('span'); icon.className = 'ach-icon'; icon.textContent = a.icon;
    const text = document.createElement('div');
    const label = document.createElement('small'); label.textContent = 'Achievement unlocked';
    const name = document.createElement('strong'); name.textContent = a.name;
    text.append(label, name);
    t.append(icon, text);
    $('toasts').append(t);
    setTimeout(() => { t.remove(); if (this.queue.length) this.toast(this.queue.shift()); }, 3700);
  },

  showRunSummary() {
    const box = $('ovAch');
    box.hidden = !this.run.length;
    box.textContent = this.run.length ? `🏆 Unlocked: ${this.run.map(a => `${a.icon} ${a.name}`).join(', ')}` : '';
  },

  render() {
    const done = ACHIEVEMENTS.filter(a => this.unlocked[a.id]).length;
    $('achCount').textContent = `${done}/${ACHIEVEMENTS.length}`;
    const list = $('achList');
    list.replaceChildren();
    // unlocked first, then the rest in list order
    const sorted = [...ACHIEVEMENTS].sort((a, b) => !!this.unlocked[b.id] - !!this.unlocked[a.id]);
    for (const a of sorted) {
      const got = !!this.unlocked[a.id], hide = a.secret && !got;
      const li = document.createElement('li');
      if (got) li.className = 'done';
      const icon = document.createElement('span'); icon.className = 'ach-icon'; icon.textContent = hide ? '❔' : a.icon;
      const body = document.createElement('div'); body.style.minWidth = '0';
      const name = document.createElement('strong'); name.textContent = hide ? 'Secret achievement' : a.name;
      const desc = document.createElement('span'); desc.className = 'ach-desc'; desc.textContent = hide ? 'Keep playing to find it.' : a.desc;
      body.append(name, desc);
      if (a.goal && !got) {
        const have = Math.min(a.goal, this.stats[a.stat] || 0);
        desc.textContent += ` (${have}/${a.goal})`;
        const bar = document.createElement('div'); bar.className = 'ach-progress';
        const fill = document.createElement('i'); fill.style.width = (100 * have / a.goal) + '%';
        bar.append(fill); body.append(bar);
      }
      li.append(icon, body);
      list.append(li);
    }
  },
};

/* =====================================================================
   LEADERBOARD
   ---------------------------------------------------------------------
   Two homes, one board UI:
   - On claude.ai (published Artifact) it uses the Artifact's shared
     database: one document per player, scores/<their id>, best run only.
   - Anywhere else (GitHub Pages, a local file) it uses Supabase. Scores
     go in only through the submit_score() database function (see
     supabase-leaderboard.sql), which keeps one best row per browser.
   With neither available, the board says so and the game plays as normal.
   ===================================================================== */
const SUPABASE = {
  url: 'https://rlflwoqkikpdezhidyhi.supabase.co',
  key: 'sb_publishable_nbt0GhD-dMOREMmdP_462Q_8tKTdbOk', // public "publishable" key; safe to ship in the page
};

// Name filter. Mirrors the blocked_words table in supabase-leaderboard.sql,
// which is what actually enforces it for the Supabase leaderboard.
//   contains: blocked anywhere, even spaced out, stretched or with symbols (f.u.c.k, fuuuck, sh1t)
//   word:     blocked only as a whole word (ass is fine inside "class")
const BLOCKED_NAMES = {
  contains: ['fuck', 'shit', 'bitch', 'cunt', 'nigger', 'nigga', 'faggot', 'retard', 'whore', 'slut',
    'pussy', 'penis', 'vagina', 'porn', 'hitler', 'tranny', 'twat', 'jizz', 'asshole', 'bastard', 'dildo',
    'pedophile', 'killyourself', 'cocksucker', 'blowjob', 'handjob', 'wetback'],
  word: ['ass', 'fag', 'fags', 'dick', 'dicks', 'cock', 'cocks', 'cum', 'rape', 'raped', 'rapist', 'nazi',
    'nazis', 'kike', 'spic', 'chink', 'dyke', 'sex', 'tit', 'tits', 'hoe', 'hoes', 'pedo', 'kys', 'boner',
    'coon', 'gook', 'beaner', 'wank', 'wanker'],
};
function nameIsBlocked(name) {
  const swaps = { 0: 'o', 1: 'i', 3: 'e', 4: 'a', 5: 's', 7: 't', '@': 'a', $: 's', '!': 'i', '|': 'i', 8: 'b' };
  const norm = name.toLowerCase().replace(/[0134578@$!|]/g, c => swaps[c]);
  const squashed = norm.replace(/[^a-z]/g, '');
  const tokens = norm.split(/[^a-z]+/);
  const stretchy = w => w.split('').map(c => c + '+').join(''); // fuck also matches fuuuck
  return BLOCKED_NAMES.contains.some(w => new RegExp(stretchy(w)).test(squashed)) ||
    BLOCKED_NAMES.word.some(w => { const rx = new RegExp('^' + stretchy(w) + '$'); return tokens.some(t => rx.test(t)); });
}

const Leaderboard = {
  mode: null, // 'claude' | 'supabase'
  db: null, uid: null, canWrite: null,
  rows: [], mine: null, pending: null, posted: false,
  TOP: 15, POLL_MS: 20000,

  async init() {
    if (!window.claude?.use) {
      if (SUPABASE.url && SUPABASE.key) return this.initSupabase();
      $('lbTitle').closest('aside').hidden = true; // no leaderboard on this copy: just the game
      return;
    }
    this.mode = 'claude';
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db) return this.status('Sign in to claude.ai to see the leaderboard.');
    this.db = db;
    this.uid = user ? await user.id() : null;
    this.canWrite = user ? await user.can('data.write') : null;
    this.status('Loading scores…');

    db.collection('scores').orderBy('score', 'desc').limit(this.TOP).onSnapshot(
      snap => { this.rows = snap.docs.map(d => ({ id: d.id, ...d.data() })); this.render(); },
      () => this.status('The leaderboard is unavailable right now. Reload to try again.'),
    );
    if (this.uid) {
      db.doc('scores/' + this.uid).onSnapshot(
        snap => { this.mine = snap.exists ? snap.data() : null; this.render(); },
        () => {},
      );
    }
  },

  /* ---------- Supabase ---------- */
  async initSupabase() {
    this.mode = 'supabase';
    // Each browser keeps a random player id: the key to its own leaderboard row.
    try {
      this.player = localStorage.getItem('dawgSnakePlayer');
      if (!this.player) { this.player = crypto.randomUUID(); localStorage.setItem('dawgSnakePlayer', this.player); }
      this.uid = localStorage.getItem('dawgSnakeRowId');
      this.mine = JSON.parse(localStorage.getItem('dawgSnakeMine') || 'null');
    } catch { this.player = this.player || crypto.randomUUID(); }
    this.status('Loading scores…');
    try { await this.sbFetch(); }
    catch { this.status('Couldn’t load the leaderboard. Check your connection and reload.'); }
    setInterval(() => { if (!document.hidden) this.sbFetch().catch(() => {}); }, this.POLL_MS);
  },
  sbHeaders(extra = {}) {
    const h = { apikey: SUPABASE.key, ...extra };
    if (SUPABASE.key.startsWith('eyJ')) h.Authorization = 'Bearer ' + SUPABASE.key; // legacy JWT-style anon key
    return h;
  },
  async sbFetch() {
    const res = await fetch(`${SUPABASE.url}/rest/v1/scores?select=id,name,score,achievements&order=score.desc,updated_at.asc&limit=${this.TOP}`,
      { headers: this.sbHeaders() });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    this.rows = (await res.json()).map(r => ({ ...r, id: String(r.id) }));
    const me = this.rows.find(r => r.id === this.uid);
    if (me) this.mine = { name: me.name, score: me.score };
    this.render();
  },
  async sbSubmit(name, run) {
    const res = await fetch(`${SUPABASE.url}/rest/v1/rpc/submit_score`, {
      method: 'POST',
      headers: this.sbHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ p_player: this.player, p_name: name, p_score: run.score, p_eaten: run.eaten, p_achievements: Achievements.count() }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw { code: 'supabase', message: String(body.message || '') };
    }
    this.uid = String(await res.json());
    this.mine = { name, score: Math.max(this.mine?.score ?? 0, run.score) };
    try {
      localStorage.setItem('dawgSnakeRowId', this.uid);
      localStorage.setItem('dawgSnakeMine', JSON.stringify(this.mine));
    } catch {}
    await this.sbFetch().catch(() => {});
  },

  status(text) { $('lbStatus').textContent = text; },

  canPost() {
    if (this.mode === 'supabase') return !!this.player;
    return !!(this.db && this.uid && this.canWrite !== false);
  },

  render() {
    const list = $('lbList');
    list.replaceChildren();
    this.rows.forEach(r => {
      const li = document.createElement('li');
      if (r.id === this.uid) li.className = 'me';
      const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = list.children.length + 1;
      const name = document.createElement('span'); name.className = 'lb-name';
      name.textContent = String(r.name || 'Anonymous dawg');
      if (r.id === this.uid) { const you = document.createElement('small'); you.textContent = '(you)'; name.append(you); }
      // achievement count; everything unlocked = golden name
      const got = Math.max(0, Math.floor(Number(r.achievements) || 0)), all = got >= ACHIEVEMENTS.length;
      const ach = document.createElement('span'); ach.className = 'lb-ach' + (all ? ' gold' : '');
      ach.textContent = '🏆 ' + Math.min(got, ACHIEVEMENTS.length);
      ach.title = `${Math.min(got, ACHIEVEMENTS.length)}/${ACHIEVEMENTS.length} achievements`;
      if (all) name.classList.add('gold');
      const score = document.createElement('span'); score.className = 'lb-score';
      score.textContent = Number(r.score) || 0;
      li.append(rank, name, ach, score);
      list.append(li);
    });

    let text;
    if (!this.rows.length) text = this.canPost()
      ? 'No scores yet. Finish a game and post yours to take the top spot.'
      : 'No scores yet.';
    else if (this.mine && !this.rows.some(r => r.id === this.uid)) text = `Your best: ${this.mine.score}. Top ${this.TOP} shown.`;
    else text = `Top ${this.TOP} dawgs, best run per player.`;
    if (!this.canPost() && this.db) text += ' Posting scores needs edit access to this game.';
    this.status(text);
  },

  // Called on game over: show the name box if this run can go on the board.
  offerPost(score, eaten) {
    this.pending = { score, eaten }; this.posted = false;
    const form = $('postForm');
    if (!this.canPost() || score <= 0) { form.hidden = true; return; }
    form.hidden = false;
    $('postBtn').disabled = false;
    const best = this.mine?.score ?? 0;
    $('postMsg').textContent = best >= score ? `Your best is ${best}. Posting updates your name only.` : '';
    let saved = this.mine?.name || '';
    try { saved = saved || localStorage.getItem('dawgSnakeName') || ''; } catch {}
    $('playerName').value = saved;
  },
  hidePost() { $('postForm').hidden = true; },

  async post(rawName) {
    if (!this.canPost() || !this.pending || this.posted) return;
    const name = rawName.replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 20);
    if (!name) { $('postMsg').textContent = 'Type a name first.'; return; }
    if (nameIsBlocked(name)) { $('postMsg').textContent = 'That name isn’t allowed. Pick a different one.'; return; }
    try { localStorage.setItem('dawgSnakeName', name); } catch {}
    const prev = this.mine, run = this.pending, better = !prev || run.score > (prev.score ?? 0);
    const doc = better
      ? { name, score: run.score, eaten: run.eaten, achievements: Achievements.count(), at: new Date().toISOString() }
      : { ...prev, name, achievements: Achievements.count() };
    $('postBtn').disabled = true;
    $('postMsg').textContent = 'Posting…';
    try {
      if (this.mode === 'supabase') await this.sbSubmit(name, run);
      else await this.db.doc('scores/' + this.uid).set(doc);
      this.posted = true;
      $('postMsg').textContent = better ? `Posted ${run.score} as ${name}.` : `Name updated. Your best is still ${prev.score}.`;
    } catch (err) {
      $('postBtn').disabled = false;
      if (err?.code === 'supabase') {
        $('postMsg').textContent = /slow down/i.test(err.message) ? 'Wait a few seconds, then post again.'
          : /not allowed/i.test(err.message) ? 'That name isn’t allowed. Pick a different one.'
          : /out of range/i.test(err.message) ? 'That score can’t be posted.'
          : 'Couldn’t post your score. Try again in a moment.';
      } else if (err?.code === 'invalid_argument') {
        this.canWrite = false; this.hidePost(); this.render();
      } else {
        $('postMsg').textContent = 'Couldn’t post your score. Try again in a moment.';
      }
    }
  },
};

$('postForm').addEventListener('submit', e => {
  e.preventDefault();
  Leaderboard.post($('playerName').value);
});

/* =====================================================================
   BOOT
   ===================================================================== */
function loop(now) {
  const dt = Math.min(100, now - (game.last || now));
  game.last = now;
  game.update(dt);
  draw();
  requestAnimationFrame(loop);
}

(async () => {
  try { await document.fonts.load(`700 40px 'UnifrakturCook'`); } catch {}
  Sprites.buildFood(CONFIG.cell);
  game.reset();
  updateHud();
  requestAnimationFrame(loop);
})();
Leaderboard.init();
Achievements.load();
Skins.load();

// Expose for console tinkering / future power-up dev
window.game = game; window.POWER_UPS = POWER_UPS; window.CONFIG = CONFIG; window.Sound = Sound;
</script>
